name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # 关键改动：不再用 maximize-build-space，直接手动清理预装工具
    - name: Free Disk Space (Manual)
      run: |
        echo "Before cleanup:"
        df -hT /
        # 删除 GitHub Runner 预装的大型工具链，通常可释放 20-30GB
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/node_modules
        # 清理 Docker 缓存
        docker system prune -af || true
        echo "After cleanup:"
        df -hT /

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push image Aliyun
      shell: bash
      run: |
        set -euo pipefail

        # 登录阿里云 ACR
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
          --username "$ALIYUN_REGISTRY_USER" \
          --password-stdin "$ALIYUN_REGISTRY"

        # 数据预处理，判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            echo "image $image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"

            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"

            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"

            # 使用 :- 提供默认值，避免 set -u 报 unbound variable
            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                if [[ "${temp_map[$image_name]:-}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]=$name_space
            fi

        done < images.txt

        # 拉取并推送镜像
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            echo "=========================================="
            echo "处理镜像: $line"
            echo "当前磁盘使用:"
            df -hT /
            echo "=========================================="

            echo "docker pull $line"
            if ! docker pull $line; then
                echo "ERROR: 拉取失败，跳过: $line"
                continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"

            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            echo "platform_prefix is $platform_prefix"

            image=$(echo "$line" | awk '{print $NF}')

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')

            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""

            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
                if [[ -n "$name_space" ]]; then
                    name_space_prefix="${name_space}_"
                fi
            fi

            image_name_tag="${image_name_tag%%@*}"

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "=========================================="
            echo "Source image: $image"
            echo "Target image: $new_image"
            echo "=========================================="

            docker tag "$image" "$new_image"

            echo "docker push $new_image"
            if ! docker push "$new_image"; then
                echo "ERROR: 推送失败: $new_image"
                docker rmi "$new_image" || true
                continue
            fi

            docker image inspect "$new_image" \
              --format='Image ID: {{.Id}}, Size: {{.Size}}'

            echo "开始清理磁盘空间"
            df -hT /

            docker rmi "$new_image" || true
            docker rmi "$image" || true
            docker builder prune -f || true

            echo "磁盘空间清理完毕"
            df -hT /

        done < images.txt

        echo "All images pushed successfully!"
