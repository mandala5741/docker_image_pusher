name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Build and push image Aliyun
      run: |
        set -euo pipefail

        # 校验必要变量，避免拼出非法镜像名
        if [[ -z "${ALIYUN_REGISTRY}" || -z "${ALIYUN_NAME_SPACE}" ]]; then
          echo "ERROR: ALIYUN_REGISTRY or ALIYUN_NAME_SPACE is empty"
          exit 1
        fi

        docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

        # 数据预处理，判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            echo "----------------------------------------------------------------"
            echo "raw line: [$line]"

            # 解析 platform（支持 --platform linux/amd64 或 --platform=linux/amd64）
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            # 从行中剥离 --platform 及其值，得到纯镜像引用，避免 docker pull 参数顺序问题
            pull_ref=$(echo "$line" | sed -E 's/--platform[ =][^ ]+[ ]*//g' | xargs)
            echo "pull_ref: [$pull_ref]"
            echo "platform: [$platform]"
            echo "platform_prefix: [$platform_prefix]"

            if [[ -z "$pull_ref" ]]; then
                echo "ERROR: empty image reference after parsing"
                exit 1
            fi

            echo "docker pull $pull_ref"
            if ! docker pull $pull_ref; then
                echo "ERROR: docker pull failed: $pull_ref"
                exit 1
            fi

            image="$pull_ref"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "new_image: [$new_image]"

            echo "docker tag $image $new_image"
            if ! docker tag "$image" "$new_image"; then
                echo "ERROR: docker tag failed: $image -> $new_image"
                exit 1
            fi

            echo "docker push $new_image"
            if ! docker push "$new_image"; then
                echo "ERROR: docker push failed: $new_image"
                exit 1
            fi

            # 验证远程仓库确实有该镜像
            echo "verify remote manifest: $new_image"
            if ! docker manifest inspect "$new_image" > /dev/null; then
                echo "ERROR: push verification failed, remote manifest not found: $new_image"
                exit 1
            fi
            echo "push verified: $new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi "$new_image" || true
            docker rmi "$image" || true
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

        done < images.txt

    - name: Cleanup Docker and background processes
      if: always()
      run: |
        docker buildx rm --all-inactive --force 2>/dev/null || true
        docker system prune -af 2>/dev/null || true
        pkill -f containerd-shim 2>/dev/null || true
        pkill -f buildkitd 2>/dev/null || true
        jobs -p | xargs -r kill 2>/dev/null || true
        wait 2>/dev/null || true
